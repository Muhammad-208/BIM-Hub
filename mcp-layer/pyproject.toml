[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bimhub"
version = "0.1.0"
description = "BIM Hub - shared MCP layer and CLI for a hierarchical BIM multi-agent team"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2",
  "pyyaml>=6",
  "httpx>=0.27",
  "olefile>=0.46",
]

[project.optional-dependencies]
ingest = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1"]   # also used by file_read for PDF/DOCX/XLSX
studio = ["fastapi>=0.110", "uvicorn>=0.29", "keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
bimhub = "bimhub.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
