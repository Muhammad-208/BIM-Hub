# Discipline profiles. Each discipline on a project's team becomes a sub-team of the roles in roles/.
disciplines:
  arc:
    title: Architecture
    role_code: A
    scope: spaces/rooms, walls, floors, ceilings, roofs, doors/windows, curtain walls, stairs/ramps, finishes, furniture, signage zones
    categories: Walls, Floors, Ceilings, Roofs, Doors, Windows, Curtain Panels/Mullions, Stairs, Railings, Rooms, Areas, Furniture, Generic Models
    loi: room data (number, name, area, finishes), fire rating of walls/doors, acoustic rating, door hardware sets, accessibility
    hotspots: ceiling voids vs MEP, shafts & openings vs STR, door swings vs MEP risers, facade vs STR edge
    codes: Egyptian building & fire-egress codes as set per project, accessibility code, client brief area schedule
  str:
    title: Structure
    role_code: S
    scope: foundations, columns, beams, slabs, walls/cores, stairs, steel members & connections, openings/sleeves, rebar (shop-drawing stage)
    categories: Structural Foundations, Columns, Framing, Floors, Walls, Rebar, Structural Connections, Shaft Openings
    loi: material/grade, fire rating, design loads reference, rebar cover, element marks
    hotspots: beams vs ducts & cable trays, slab openings vs MEP risers, columns vs ARC grid, drops vs ceiling heights
    codes: ECP 201 (loads), ECP 203 (RC), ECP 205 (steel) plus any client/international code in project.yaml; shop drawings via the sd-agent MCP
  mech:
    title: Mechanical (HVAC)
    role_code: M
    scope: ducts, fittings, air terminals, AHUs/FCUs/chillers, chilled/hot water pipes, equipment clearances, smoke extract
    categories: Ducts, Duct Fittings, Air Terminals, Mechanical Equipment, Pipes (HVAC systems), Flex Ducts, Duct Insulation
    loi: system classification/name, flow, size, equipment tag, power, maintenance zone
    hotspots: ducts vs STR beams (biggest risk), ducts vs cable trays, equipment clearance & access, ceiling heights
    codes: ASHRAE 62.1 / 90.1, SMACNA, Egyptian HVAC code as set per project
  plumb:
    title: Plumbing & Drainage (Public Health)
    role_code: P
    scope: domestic cold/hot water, drainage (soil/waste/vent), storm water, fixtures, pumps & tanks, slopes
    categories: Pipes, Pipe Fittings, Plumbing Fixtures, Mechanical Equipment (pumps/tanks), Pipe Accessories
    loi: system, diameter, slope, material, fixture units, equipment tag
    hotspots: gravity drainage slopes vs STR beams (cannot move up), risers vs ARC shafts, pipes vs ducts
    codes: IPC / BS EN 12056, Egyptian plumbing code as set per project
  ff:
    title: Fire Fighting & Life Safety
    role_code: FP
    scope: sprinkler pipes & heads, hydrants & hose reels, fire pumps, standpipes, gas suppression, extinguisher locations
    categories: Sprinklers, Pipes (fire systems), Mechanical Equipment (fire pumps), Pipe Accessories (valves), Generic Models (extinguishers)
    loi: system, hazard class, head type/K-factor, coverage, pipe schedule, valve tags
    hotspots: sprinkler heads vs ceiling grid & lights, mains vs ducts, coverage vs obstructions (beams/ducts > 1.2 m)
    codes: NFPA 13 / 14 / 20, Egyptian fire protection code as set per project
  elec:
    title: Electrical
    role_code: E
    scope: cable trays & conduits, panels/DBs/switchgear, lighting, power devices, earthing & lightning, generators, transformers
    categories: Cable Trays, Conduits, Electrical Equipment, Electrical Fixtures, Lighting Fixtures, Lighting Devices
    loi: circuit/panel, load, voltage, IP rating, equipment tag, tray size & fill
    hotspots: trays vs ducts & pipes (no wet services above electrical), panel clearances, lights vs sprinklers & diffusers
    codes: IEC 60364 / BS 7671, Egyptian electrical code as set per project
  ict:
    title: ICT / ELV (Low Current)
    role_code: IT
    scope: structured cabling, data/telecom rooms & racks, CCTV, access control, fire alarm devices, PA/BGM, BMS, nurse call
    categories: Communication Devices, Data Devices, Fire Alarm Devices, Security Devices, Nurse Call Devices, Cable Trays (ELV), Electrical Equipment
      (racks)
    loi: system, device type, network/zone, rack/port reference, power (PoE)
    hotspots: ELV trays vs power trays (separation), devices vs ceiling elements, IDF/MDF rooms vs MEP
    codes: TIA-568 / 569 / 606 / 607, NFPA 72 (fire alarm), client IT standards
  infra:
    title: Infrastructure & Civil
    role_code: C
    scope: roads & alignments, grading/earthworks, utility networks (water, sewer, storm, power, telecom), site drainage, parking
    categories: 'Civil 3D: Alignments, Profiles, Corridors, Surfaces, Pipe & Pressure Networks; Revit: Toposolid, Site'
    loi: network/system, invert levels, slopes, diameters, chainage, material
    hotspots: utility crossings (vertical clearance), networks vs building foundations, levels at building entries
    codes: AASHTO, Egyptian roads code as set per project, utility authority requirements; uses the civil3d MCP
  land:
    title: Landscape
    role_code: L
    scope: hardscape, softscape, planting, irrigation, site furniture, water features, green roofs
    categories: Planting, Site, Hardscape Floors, Irrigation Pipes, Generic Models (site furniture)
    loi: species, size at planting, irrigation zone, material/finish
    hotspots: tree pits vs underground utilities, irrigation vs drainage, levels vs ARC entrances
    codes: client landscape guidelines, local authority requirements
